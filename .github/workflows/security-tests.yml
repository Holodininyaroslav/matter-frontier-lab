name: Security regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy scipy onnx onnxruntime rdkit==2026.3.5
      - run: python -m pytest tests/test_local_security.py tests/test_discovery_chain_http.py
      - run: python -m pytest tests/test_chimerax_security.py tests/test_biomolecule_adapter.py
      - run: node --test tests/test_m_orchestrator.mjs tests/test_gamma_repair.mjs tests/test_smart_assembly.mjs
