<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shor on CUDA-Q</title><link rel="icon" href="../assets/matter-frontier-lab-avatar.png"><link rel="stylesheet" href="../code-inspector.css?v=3"></head>
<body data-demo-page="shor"><main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-orbit">Q</span><div><strong>MATTER FRONTIER LAB</strong><small>ALGORITHM INSPECTOR · SHOR / CUDA-Q</small></div></div><div class="top-actions"><a class="ghost" href="../" data-common="back">← Matter Frontier Lab</a><label class="language"><span data-common="language">Language</span><select id="languageSelect"><option value="en">English</option><option value="ru">Русский</option><option value="he">עברית</option></select></label></div></header>
  <nav class="demo-tabs" data-demo-tabs><a data-demo-page="shor" data-href="../cudaq-shor-demo/" href="../cudaq-shor-demo/">01 · Shor / CUDA-Q</a><a data-demo-page="asic" data-href="../hybrid-quantum-asic-demo/" href="../hybrid-quantum-asic-demo/">02 · ASIC + CUDA-Q</a><a data-demo-page="quark" data-href="../multiquark-algorithm/" href="../multiquark-algorithm/">03 · Multi-quark search</a><a data-demo-page="chain" data-href="../discovery-chain/" href="../discovery-chain/">04 · Discovery Chain</a></nav>
  <section class="hero"><p class="eyebrow" data-copy="eyebrow"></p><h1 data-copy="title"></h1><p class="lede" data-copy="intro"></p></section>
  <section class="shor-workbench" aria-labelledby="shorWorkbenchTitle">
    <div class="shor-controlbar"><div><p class="eyebrow" data-shor-copy="workbenchEyebrow"></p><h2 id="shorWorkbenchTitle" data-shor-copy="workbenchTitle"></h2></div><div class="shor-actions"><button id="shorRun" type="button"></button><button id="shorStep" type="button"></button><button id="shorReset" type="button"></button></div></div>
    <div class="shor-facts"><span><b>N</b> = 15</span><span><b>a</b> = 2</span><span><b>r</b> = <output id="orderValue">?</output></span><span><b>15</b> = <output id="factorValue">? × ?</output></span><span class="simulator-badge" data-shor-copy="simulatorBadge"></span></div>
    <div class="shor-layout">
      <div><div id="shorCircuit" class="quantum-circuit" aria-label="Eight-qubit Shor circuit"></div><div id="shorStageRail" class="shor-stage-rail"></div></div>
      <aside class="shor-explanation"><p id="shorStepKicker" class="eyebrow"></p><h3 id="shorStepTitle"></h3><p id="shorStepText"></p><div class="formula" id="shorFormula"></div></aside>
    </div>
    <div class="measurement-panel"><div><p class="eyebrow" data-shor-copy="measurementEyebrow"></p><h3 data-shor-copy="measurementTitle"></h3><p data-shor-copy="measurementText"></p></div><div id="phaseHistogram" class="phase-histogram"></div></div>
  </section>
  <section class="flow-overview" aria-labelledby="flowTitle"><div class="section-head flow-head"><div><p class="eyebrow" data-common="flow"></p><h2 id="flowTitle" data-copy="flowTitle"></h2></div><p data-copy="flowIntro"></p></div><div class="flow-legend"><span><i class="legend-line runtime"></i><b data-common="runtimeDependency"></b></span><span><i class="legend-line reference"></i><b data-common="referenceDependency"></b></span><span><i class="legend-parallel">∥</i><b data-common="parallelLane"></b></span></div><div id="flowMap" class="flow-map"></div></section>
  <section id="statusGrid" class="status-grid"></section>
  <div class="section-head"><div><p class="eyebrow" data-common="architecture"></p><h2 data-copy="architectureTitle"></h2></div><p data-common="architectureIntro"></p></div><section id="architecture" class="architecture"></section>
  <div class="section-head"><div><p class="eyebrow" data-common="stages"></p><h2 data-copy="stagesTitle"></h2></div><p data-common="stagesIntro"></p></div>
  <section class="inspector"><nav id="stageList" class="stage-list" aria-label="Algorithm stages"></nav><article class="stage-detail"><div class="stage-detail-head"><div><p id="stageKicker" class="eyebrow"></p><h3 id="stageTitle"></h3><p id="stageSummary"></p></div><a id="sourceLink" class="source-pill" target="_blank" rel="noreferrer"></a></div><div id="substeps" class="substeps"></div><div id="tableWrap" class="table-wrap"></div><div class="stage-nav"><button id="prevStage" type="button" data-common="previous"></button><button id="nextStage" type="button" data-common="next"></button></div></article></section>
  <div class="section-head"><div><p class="eyebrow" data-common="sources"></p><h2 data-copy="sourcesTitle"></h2></div></div><section id="sources" class="sources"></section>
  <section class="boundary"><p class="eyebrow" data-common="boundary"></p><h2 data-copy="boundaryTitle"></h2><p id="boundaryText"></p></section>
</main><script src="./app.js?v=3"></script><script src="../code-inspector.js?v=3"></script></body></html>
